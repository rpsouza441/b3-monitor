spring:
  datasource:
    url: jdbc:h2:mem:b3monitor;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop   # H2 slice tests build schema from entities
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false            # Flyway/Postgres DDL is exercised by *IT (Testcontainers), not unit tests

b3monitor:
  workers:
    enabled: false
  brapi:
    token: ""
